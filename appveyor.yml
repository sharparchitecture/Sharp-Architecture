version: .{build}

pull_requests:
  do_not_increment_build_number: true

nuget:
  disable_publish_on_pr: true

image:
  - Ubuntu2204
  - Visual Studio 2022

environment:
  CAKE_SETTINGS_SKIPVERIFICATION: true
  CAKE_SETTINGS_SKIPPACKAGEVERSIONCHECK: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true


test: off

matrix:
  fast_finish: true

for:

# Linux build
-
  matrix:
    only:
      - image: Ubuntu2204

  clone_folder: ~/work/sharp-arch

  environment:
    NO_COLOR=1
  install:
    - sh: dotnet --info
    - sh: touch ./Src/Common/AssemblyVersion.cs
    - sh: dotnet new tool-manifest

  build_script:
    - sh: cd Src
    - sh: dotnet build -c Release --verbosity quiet
    - sh: dotnet test --no-build -c Release --filter Category!=Samples --test-adapter-path . --logger AppVeyor --verbosity quiet


# Windows build
-
  matrix:
    only:
      - image: Visual Studio 2022

  clone_folder: c:\work\sharp-arch

  cache:
    - c:\tmp\cake\tools -> build\*.cake, appveyor.yml

  services:
    - mssql2019

  install:
    - ps: dotnet --info
    - ps: ./mssql-setup.ps1
    - ps: dotnet new tool-manifest
    - ps: dotnet tool install Cake.Tool --version 4.0.0
    - ps: dotnet tool install coveralls.net --version 4.0.1

  build_script:
      - ps: dotnet cake

  environment:
    coveralls_repo_token:
      secure: FgZlD1O2ilcGB6nF7cIgNcF6f8wWJk//ish6EG800QfuMd0y3BQWUXkl9u7TB4yG
    appveyor_cache_entry_zip_args: -t7z -m0=lzma -mx=5 -ms=on
    CAKE_PATHS_TOOLS: c:\tmp\cake\tools\
    GITHUB_TOKEN:
      secure: FgP/dEF7lumDgbjt3tzPSDqDTM16uoiPfKZPQSLJO+/GaIR2zSquSh0pXP8znx+c

  artifacts:
    - path: Drops/Packages/*.nupkg
      name: NuGet packages

    - path: Drops/Packages/*.snupkg
      name: NuGet symbol packages
      type: NuGetPackage
  #  - path: Drops/Inspections/CodeDuplicates.html
  #    name: CodeDuplicates
  #  - path: Drops/Inspections/CodeInspections.html
  #    name: CodeInspections

  deploy:
    - provider: NuGet
      name: Pre-release
      api_key:
        secure: m1EVabIKTlkNQvpNEDPw7C80EkHuL+/k4oD1BudXJffbrMmVH24TUuKxiMV5oYdy
      on:
        branch:
          - develop
          - /release\/v.*/
          - /releases?\/.*/
          - /hotfix(?:es)?\/.*/

    - provider: NuGet
      name: Tagged release
      api_key:
        secure: m1EVabIKTlkNQvpNEDPw7C80EkHuL+/k4oD1BudXJffbrMmVH24TUuKxiMV5oYdy
      on:
        appveyor_repo_tag: true
