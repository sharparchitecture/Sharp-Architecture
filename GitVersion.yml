# assembly-file-versioning-scheme: MajorMinorPatch
mode: ContinuousDelivery

branches:
  master:
    label: ''
    regex: "^master$"
    increment: patch
    is-release-branch: true

  develop:
    label: alpha
    increment: minor
    is-release-branch: false

  release:
    # Matches release/1.5.3 or release/2.0.0
    regex: release?[/-](?<version>\d+\.\d+\.\d+)
    label: rc
    is-release-branch: true
    increment: none

ignore:
  sha: []
